<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050508" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; form-action 'self'"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>Echolocation</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
        color: #c8d0dc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: default;
      }

      @supports (height: 100dvh) {
        html,
        body,
        canvas {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Echolocation game canvas"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
